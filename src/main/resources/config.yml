# HeadHunt configuration
# Prices are in your Vault economy's currency. The values below are placeholders:
# tune them against how fast players earn money on your server.

# Percentage taken from every head sale (money sink). 0 disables it.
sale-tax-percent: 0

# Extra drop chance per Looting level (0.01 = +1% per level).
looting-bonus-per-level: 0.01

# Tell the killer when a head drops.
notify-on-drop: true

# Worlds where heads never drop.
disabled-worlds: []

# Mobs from spawners DO drop heads (nothing is blocked by default).
# To stop farming, list spawn reasons here, e.g. [SPAWNER, BREEDING, EGG].
# Reasons: https://jd.papermc.io/paper/1.21.11/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
blocked-spawn-reasons: []

# Title of the /headlist menu (MiniMessage format).
gui:
  title: "<gold>HeadHunt <dark_gray>| <gray>Mob Heads"

# Participating mobs. Key = Minecraft entity ID in lowercase. This list is also what /headlist shows.
#   chance:  drop probability, 0.05 = 5%
#   price:   sale value per head
#   owner:   (optional) player account whose skin is used for the head. The MHF_* accounts
#            are the classic mob-head skins. Loaded from Mojang's servers.
#   texture: (optional) base64 skin "Value" from minecraft-heads.com. Overrides owner.
# Vanilla head models are used automatically for zombie, skeleton, wither_skeleton,
# creeper, piglin and ender_dragon.
mobs:
  creeper:
    chance: 0.05
    price: 25.0
  spider:
    chance: 0.05
    price: 15.0
    owner: MHF_Spider
  zombie:
    chance: 0.05
    price: 15.0
  skeleton:
    chance: 0.05
    price: 15.0
  chicken:
    chance: 0.05
    price: 6.0
    owner: MHF_Chicken
  cow:
